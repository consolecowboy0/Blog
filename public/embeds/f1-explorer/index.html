    <script>
      (function(){
  function applyTheme(t){
    if (t === 'dark' || t === 'rainbow') {
      document.documentElement.setAttribute('data-theme', t);
    } else if (t === 'light') {
      document.documentElement.removeAttribute('data-theme');
    }
  }
  var urlTheme = new URLSearchParams(location.search).get('theme');
  if (urlTheme === 'light' || urlTheme === 'dark' || urlTheme === 'rainbow') {
    applyTheme(urlTheme);
  } else {
    var saved = localStorage.getItem('theme');
    if (saved === 'dark' || saved === 'rainbow') {
      applyTheme(saved);
    } else if (saved === 'light') {
      // explicit user choice — leave default (no attribute)
    } else {
      applyTheme('rainbow');
    }
  }
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'parent-theme') {
      applyTheme(e.data.theme);
      // No localStorage write — parent owns persisted preference.
    }
  });
})();
    </script>

    <script>
      document.getElementById('theme-toggle-btn').addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var cycle = { light: 'dark', dark: 'rainbow', rainbow: 'light' };
        var next = cycle[current] || 'dark';
        if (next === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', next);
        }
        localStorage.setItem('theme', next);
      });
      // Move toggle into React-rendered header once it mounts
      var observer = new MutationObserver(function() {
        var header = document.querySelector('.header');
        var btn = document.getElementById('theme-toggle-btn');
        if (header && btn) {
          header.appendChild(btn);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
