<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-label="The five steps from finding a criminal to justice; a vigilante can do one" font-family="Inter, system-ui, sans-serif"><rect width="820" height="330" rx="10" fill="#fff"/><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a">Finding the guy is step one of five</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555">What it takes to turn 'I know who did it' into 'he is lawfully off the street.'</text><rect x="40.0" y="110" width="136.8" height="120" rx="6" fill="rgba(30,132,73,0.12)" stroke="#1e8449" stroke-width="2"/><text x="108.4" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a1a">1. Find the</text><text x="108.4" y="156.0" font-size="13" text-anchor="middle" font-weight="700" fill="#1a1a1a">offender</text><text x="108.4" y="186.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1e8449">the vigilante</text><text x="108.4" y="201.0" font-size="11" text-anchor="middle" font-weight="400" fill="#1e8449">can do this</text><text x="183.8" y="175.0" font-size="18" text-anchor="middle" fill="#9aa0a6">&#8594;</text><rect x="190.8" y="110" width="136.8" height="120" rx="6" fill="rgba(154,160,166,0.10)" stroke="#9aa0a6" stroke-width="1"/><text x="259.2" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">2. Gather</text><text x="259.2" y="156.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">admissible evidence</text><text x="259.2" y="186.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">needs a warrant,</text><text x="259.2" y="201.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">chain of custody</text><text x="334.6" y="175.0" font-size="18" text-anchor="middle" fill="#9aa0a6">&#8594;</text><rect x="341.6" y="110" width="136.8" height="120" rx="6" fill="rgba(154,160,166,0.10)" stroke="#9aa0a6" stroke-width="1"/><text x="410.0" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">3. Make a</text><text x="410.0" y="156.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">lawful arrest</text><text x="410.0" y="186.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">needs arrest</text><text x="410.0" y="201.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">power</text><text x="485.4" y="175.0" font-size="18" text-anchor="middle" fill="#9aa0a6">&#8594;</text><rect x="492.4" y="110" width="136.8" height="120" rx="6" fill="rgba(154,160,166,0.10)" stroke="#9aa0a6" stroke-width="1"/><text x="560.8" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">4. Prosecute +</text><text x="560.8" y="156.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">credible sanction</text><text x="560.8" y="186.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">needs a DA and</text><text x="560.8" y="201.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">a courtroom</text><text x="636.2" y="175.0" font-size="18" text-anchor="middle" fill="#9aa0a6">&#8594;</text><rect x="643.2" y="110" width="136.8" height="120" rx="6" fill="rgba(154,160,166,0.10)" stroke="#9aa0a6" stroke-width="1"/><text x="711.6" y="138.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">5. Off-ramp /</text><text x="711.6" y="156.0" font-size="13" text-anchor="middle" font-weight="700" fill="#555">deterrence</text><text x="711.6" y="186.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">needs social</text><text x="711.6" y="201.0" font-size="11" text-anchor="middle" font-weight="400" fill="#9aa0a6">services</text><text x="40.0" y="264.0" font-size="13" text-anchor="start" font-weight="600" fill="#1a1a1a">He owns step one. The institution owns the four that actually convert a name into justice.</text></svg>
