<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="Quadrant: a vigilante is the right tool only when you are nearly certain of guilt and the justice system cannot act" font-family="Inter, system-ui, sans-serif"><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a">When is a real Batman the right tool?</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555">Only when you are almost certain he's guilty AND the justice system won't act. That's a tiny corner.</text><rect x="430.0" y="290.0" width="310.0" height="190.0" fill="#c0392b" fill-opacity="0.12"/><rect x="120" y="100" width="620" height="380" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><line x1="430.0" y1="100" x2="430.0" y2="480" stroke="#9aa0a6" stroke-dasharray="4 4"/><line x1="120" y1="290.0" x2="740" y2="290.0" stroke="#9aa0a6" stroke-dasharray="4 4"/><text x="430.0" y="514.0" font-size="13" text-anchor="middle" font-weight="400" fill="#555">how sure are we he's guilty  →</text><text x="106.0" y="108.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555">system</text><text x="106.0" y="122.0" font-size="12" text-anchor="middle" font-weight="600" fill="#555">CAN act</text><text x="106.0" y="472.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555">system</text><text x="106.0" y="486.0" font-size="12" text-anchor="middle" font-weight="600" fill="#555">CAN'T act</text><text x="120.0" y="90.0" font-size="11" text-anchor="start" font-weight="400" fill="#9aa0a6">low prior</text><text x="740.0" y="90.0" font-size="11" text-anchor="end" font-weight="400" fill="#9aa0a6">extraordinary prior</text><text x="275.0" y="202.6" font-size="15" text-anchor="middle" font-weight="700" fill="#2c3e50">Due process</text><text x="275.0" y="222.6" font-size="11" text-anchor="middle" font-weight="400" fill="#555">investigate, build a case</text><text x="585.0" y="202.6" font-size="15" text-anchor="middle" font-weight="700" fill="#2c3e50">Just call the cops</text><text x="585.0" y="222.6" font-size="11" text-anchor="middle" font-weight="400" fill="#555">hand them the file</text><text x="275.0" y="381.2" font-size="15" text-anchor="middle" font-weight="700" fill="#9aa0a6">Nobody can help</text><text x="275.0" y="401.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555">and a guesser here is a menace</text><text x="585.0" y="373.6" font-size="16" text-anchor="middle" font-weight="800" fill="#c0392b">THE BATMAN ZONE</text><text x="585.0" y="393.6" font-size="11" text-anchor="middle" font-weight="400" fill="#c0392b">you know. they won't. he's uniquely suited.</text><circle cx="504.4" cy="176.0" r="5.5" fill="#2c3e50"/><text x="504.4" y="166.0" font-size="12" text-anchor="middle" font-weight="700" fill="#2c3e50">random mugger</text><circle cx="256.4" cy="426.8" r="5.5" fill="#9aa0a6"/><text x="256.4" y="448.8" font-size="12" text-anchor="middle" font-weight="700" fill="#9aa0a6">a guy you have a hunch about</text><circle cx="696.6" cy="434.4" r="5.5" fill="#c0392b"/><text x="696.6" y="458.4" font-size="12" text-anchor="end" font-weight="700" fill="#c0392b">the Joker</text><text x="120.0" y="542.0" font-size="12" text-anchor="start" font-weight="400" fill="#555">The comics are not dumb. Every Batman story drops him in the red corner on purpose: a villain everyone</text><text x="120.0" y="560.0" font-size="12" text-anchor="start" font-weight="400" fill="#555">knows is guilty, who keeps beating the system. Real life rarely hands you that corner. Fiction hands it over every issue.</text></svg>
