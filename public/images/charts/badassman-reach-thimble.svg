<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-label="Batman's reach versus the city of Richmond, drawn to scale" font-family="Inter, system-ui, sans-serif"><rect x="0" y="0" width="820" height="560" rx="10" fill="#ffffff"/><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a" >His reach vs. the city</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555" >Richmond is ~60 square miles. One vigilante's interception reach is a 0.5-mile diamond.</text><rect x="60" y="95" width="440" height="440" fill="#f4f6f8" stroke="#888" stroke-width="1.5"/><circle cx="139.0" cy="486.5" r="14.0" fill="#e67e22" fill-opacity="0.45"/><circle cx="196.6" cy="500.3" r="11.8" fill="#e67e22" fill-opacity="0.45"/><circle cx="176.3" cy="448.6" r="10.1" fill="#e67e22" fill-opacity="0.45"/><circle cx="92.2" cy="423.7" r="8.7" fill="#e67e22" fill-opacity="0.45"/><circle cx="88.6" cy="436.7" r="7.7" fill="#e67e22" fill-opacity="0.45"/><circle cx="94.3" cy="497.0" r="6.9" fill="#e67e22" fill-opacity="0.45"/><circle cx="156.7" cy="367.5" r="6.2" fill="#e67e22" fill-opacity="0.45"/><circle cx="103.8" cy="473.7" r="5.7" fill="#e67e22" fill-opacity="0.45"/><circle cx="192.4" cy="346.2" r="5.4" fill="#e67e22" fill-opacity="0.45"/><circle cx="183.6" cy="443.2" r="5.1" fill="#e67e22" fill-opacity="0.45"/><circle cx="253.8" cy="504.8" r="4.8" fill="#e67e22" fill-opacity="0.45"/><circle cx="233.1" cy="462.0" r="4.6" fill="#e67e22" fill-opacity="0.45"/><circle cx="107.4" cy="492.3" r="4.5" fill="#e67e22" fill-opacity="0.45"/><circle cx="136.3" cy="369.4" r="4.4" fill="#e67e22" fill-opacity="0.45"/><circle cx="113.8" cy="410.6" r="4.3" fill="#e67e22" fill-opacity="0.45"/><circle cx="194.4" cy="447.5" r="4.2" fill="#e67e22" fill-opacity="0.45"/><circle cx="178.4" cy="501.9" r="4.2" fill="#e67e22" fill-opacity="0.45"/><circle cx="86.2" cy="444.4" r="4.1" fill="#e67e22" fill-opacity="0.45"/><circle cx="359.4" cy="346.9" r="4.1" fill="#e67e22" fill-opacity="0.45"/><circle cx="198.2" cy="277.4" r="4.1" fill="#e67e22" fill-opacity="0.45"/><circle cx="259.4" cy="403.1" r="4.1" fill="#e67e22" fill-opacity="0.45"/><polygon points="182.3,404.6 210.8,433.0 182.3,461.4 153.9,433.0" fill="#c0392b" fill-opacity="0.85" stroke="#7b241c" stroke-width="1"/><circle cx="182.3" cy="433.0" r="2.5" fill="#fff"/><line x1="60" y1="557" x2="116.85115146037606" y2="557" stroke="#1a1a1a" stroke-width="2"/><text x="60.0" y="575.0" font-size="12" text-anchor="start" font-weight="400" fill="#555" >1 mile</text><polygon points="540,150 552,162 540,174 528,162" fill="#c0392b" fill-opacity="0.85"/><text x="564.0" y="166.0" font-size="14" text-anchor="start" font-weight="400" fill="#1a1a1a" >Reach in 2 min at 15 mph</text><circle cx="540" cy="200" r="8" fill="#e67e22" fill-opacity="0.45"/><text x="564.0" y="205.0" font-size="14" text-anchor="start" font-weight="400" fill="#1a1a1a" >Crime hot spots (21)</text><text x="540.0" y="250.0" font-size="13" text-anchor="start" font-weight="400" fill="#555" >p(reach a random crime)</text><text x="540.0" y="278.0" font-size="30" text-anchor="start" font-weight="800" fill="#c0392b" >5.6%</text><text x="540.0" y="304.0" font-size="13" text-anchor="start" font-weight="400" fill="#555" >of the city is in range</text><text x="540.0" y="348.0" font-size="13" text-anchor="start" font-weight="400" fill="#555" >He is one body. The diamond is the</text><text x="540.0" y="366.0" font-size="13" text-anchor="start" font-weight="400" fill="#555" >whole job. Everything outside it</text><text x="540.0" y="384.0" font-size="13" text-anchor="start" font-weight="400" fill="#555" >happens without him.</text></svg>
