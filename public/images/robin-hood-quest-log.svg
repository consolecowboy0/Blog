<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" width="620" height="600" font-family="'JetBrains Mono','Courier New',monospace">
  <!-- transparent: legible on light, dark, and rainbow themes via text halos + double-stroke borders -->

  <!-- border (black under, white over = visible on any background) -->
  <rect x="6" y="6" width="608" height="588" rx="14" fill="none" stroke="#000" stroke-width="6" opacity="0.55"/>
  <rect x="6" y="6" width="608" height="588" rx="14" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.8"/>

  <!-- window dots -->
  <circle cx="34" cy="36" r="6.5" fill="#ff5f56" stroke="#000" stroke-width="1"/>
  <circle cx="56" cy="36" r="6.5" fill="#ffbd2e" stroke="#000" stroke-width="1"/>
  <circle cx="78" cy="36" r="6.5" fill="#27c93f" stroke="#000" stroke-width="1"/>

  <g stroke-linejoin="round" paint-order="stroke">
    <text x="318" y="44" text-anchor="middle" fill="#34d171" stroke="#000" stroke-width="4" font-size="24" font-weight="700" letter-spacing="3">QUEST COMPLETE</text>

    <text x="310" y="102" text-anchor="middle" fill="#fff" stroke="#000" stroke-width="3.5" font-size="18" font-weight="700">ROBIN HOOD — DAY 1 (cont.)</text>

    <g font-size="15" fill="#fff" stroke="#000" stroke-width="2.5">
      <text x="40" y="142">CLASS ....... Suburban Vigilante</text>
      <text x="40" y="168">WEAPON ...... Subaru WRX (short wheelbase)</text>
      <text x="40" y="194">RATIONS ..... Summer Red Bull (warm)</text>
    </g>

    <text x="40" y="250" fill="#34d171" stroke="#000" stroke-width="2.5" font-size="15" letter-spacing="4" font-weight="700">— STATS —</text>

    <g font-size="22" stroke="#000" stroke-width="4">
      <text x="40" y="292" fill="#fff">GOLD SPENT ·············· <tspan fill="#f5c451" font-weight="700">$455</tspan></text>
      <text x="40" y="326" fill="#fff">XP GAINED ··············· <tspan font-weight="700">0</tspan></text>
      <text x="40" y="360" fill="#fff">CHARISMA ROLL ·········· <tspan fill="#34d171" font-weight="700">NAT 20</tspan></text>
      <text x="40" y="394" fill="#fff">HUGS RECEIVED ·········· <tspan font-weight="700">1</tspan></text>
      <text x="40" y="428" fill="#fff">WIFE CALLS IGNORED ····· <tspan font-weight="700">1</tspan></text>
      <text x="40" y="462" fill="#fff">OFFERS DECLINED ········ <tspan font-weight="700">1</tspan></text>
    </g>
    <text x="40" y="486" fill="#cfd5e0" stroke="#000" stroke-width="2" font-size="13" font-style="italic">subject left intact</text>
  </g>

  <!-- achievement box (double-stroke border) -->
  <rect x="40" y="524" width="540" height="52" rx="8" fill="none" stroke="#000" stroke-width="5" opacity="0.5"/>
  <rect x="40" y="524" width="540" height="52" rx="8" fill="none" stroke="#f5c451" stroke-width="2"/>
  <g stroke-linejoin="round" paint-order="stroke">
    <text x="60" y="548" fill="#f5c451" stroke="#000" stroke-width="2.5" font-size="12" letter-spacing="2" font-weight="700">ACHIEVEMENT UNLOCKED</text>
    <text x="60" y="568" fill="#fff" stroke="#000" stroke-width="3" font-size="16" font-weight="700">“That's My Daddy”</text>
  </g>
</svg>
