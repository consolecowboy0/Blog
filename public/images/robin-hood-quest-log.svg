<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <!-- Minimal line-art longbow. Theme-proof: black halo under, white line over. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- halo pass (black, sits under, visible on light backgrounds) -->
    <g stroke="#000" opacity="0.5">
      <path d="M210 60 Q92 290 210 520" stroke-width="9"/>
      <path d="M210 60 L210 520" stroke-width="7"/>
      <path d="M150 470 L300 150" stroke-width="7"/>
      <path d="M300 150 L278 178 M300 150 L272 162" stroke-width="7"/>
      <path d="M150 470 L132 488 M158 454 L140 472" stroke-width="7"/>
    </g>
    <!-- line pass (white, on top, visible on dark backgrounds) -->
    <g stroke="#fff" opacity="0.95">
      <path d="M210 60 Q92 290 210 520" stroke-width="3.2"/>
      <path d="M210 60 L210 520" stroke-width="2"/>
      <path d="M150 470 L300 150" stroke-width="2.4"/>
      <path d="M300 150 L278 178 M300 150 L272 162" stroke-width="2.4"/>
      <path d="M150 470 L132 488 M158 454 L140 472" stroke-width="2.4"/>
    </g>
  </g>
</svg>
