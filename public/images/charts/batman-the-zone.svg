<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="40" y="44" font-size="15" fill="#111" font-weight="600" letter-spacing="0.5">THE ONE SQUARE HE BELONGS IN</text>
  <text x="40" y="64" font-size="12" fill="#555">When is a masked man with no badge the right tool? Exactly once.</text>
  <line x1="40" y1="78" x2="600" y2="78" stroke="#111" stroke-width="1.5"/>

  <!-- highlighted cell behind grid -->
  <rect x="340" y="248" width="220" height="140" fill="#f4ddda"/>

  <!-- grid -->
  <rect x="120" y="108" width="440" height="280" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="340" y1="108" x2="340" y2="388" stroke="#111" stroke-width="1"/>
  <line x1="120" y1="248" x2="560" y2="248" stroke="#111" stroke-width="1"/>
  <rect x="340" y="248" width="220" height="140" fill="none" stroke="#b8332b" stroke-width="2.5"/>

  <!-- top-left: guessing / can act -->
  <text x="230" y="174" font-size="13" fill="#111" text-anchor="middle" font-weight="600">Hold a trial.</text>
  <text x="230" y="194" font-size="11" fill="#555" text-anchor="middle">warrants, juries, the slow way</text>

  <!-- top-right: certain / can act -->
  <text x="450" y="174" font-size="13" fill="#111" text-anchor="middle" font-weight="600">Just call the cops.</text>
  <text x="450" y="194" font-size="11" fill="#555" text-anchor="middle">the system's actual job</text>

  <!-- bottom-left: guessing / can't -->
  <text x="230" y="314" font-size="13" fill="#111" text-anchor="middle" font-weight="600">A masked man guessing.</text>
  <text x="230" y="334" font-size="11" fill="#555" text-anchor="middle">tackles a dad to his car</text>

  <!-- bottom-right: THE BATMAN ZONE -->
  <text x="450" y="312" font-size="15" fill="#b8332b" text-anchor="middle" font-weight="800" letter-spacing="0.5">THE BATMAN ZONE</text>
  <text x="450" y="332" font-size="11.5" fill="#111" text-anchor="middle">certain + a captured court</text>

  <!-- x axis label -->
  <text x="230" y="414" font-size="11.5" fill="#555" text-anchor="middle">GUESSING</text>
  <text x="450" y="414" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600">CERTAIN  (p &#8594; 1)</text>
  <text x="340" y="438" font-size="11" fill="#555" text-anchor="middle">how sure he is the target is guilty &#8594;</text>

  <!-- y axis label -->
  <text x="104" y="178" font-size="11.5" fill="#111" text-anchor="middle" font-weight="600" transform="rotate(-90 104 178)">LAW CAN ACT</text>
  <text x="104" y="318" font-size="11.5" fill="#555" text-anchor="middle" transform="rotate(-90 104 318)">LAW CAN'T</text>
</svg>
