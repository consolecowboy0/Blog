<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Curved tire tracks looping back from a tight U-turn on an empty road">
  <g stroke-linejoin="round" stroke-linecap="round" paint-order="stroke" fill="none">
    <!-- road edges, faint -->
    <path d="M30 300 L30 150" stroke="#000" stroke-width="5" opacity="0.4"/>
    <path d="M290 300 L290 150" stroke="#000" stroke-width="5" opacity="0.4"/>
    <path d="M30 300 L30 150" stroke="#fff" stroke-width="2"/>
    <path d="M290 300 L290 150" stroke="#fff" stroke-width="2"/>

    <!-- tire track A: up, loop over the top, back down -->
    <path d="M120 305 C120 230 110 170 160 150 C210 130 215 200 215 305"
          stroke="#000" stroke-width="6" opacity="0.5"/>
    <path d="M120 305 C120 230 110 170 160 150 C210 130 215 200 215 305"
          stroke="#fff" stroke-width="2.5"/>

    <!-- tire track B: parallel companion track -->
    <path d="M150 305 C150 235 142 185 168 175 C194 165 188 230 188 305"
          stroke="#000" stroke-width="6" opacity="0.5"/>
    <path d="M150 305 C150 235 142 185 168 175 C194 165 188 230 188 305"
          stroke="#fff" stroke-width="2.5"/>

    <!-- the car, small, at the bottom finishing the turn -->
    <path d="M196 280 C196 268 204 264 218 264 L246 264 C258 264 262 270 262 280 L262 290 C262 295 258 297 252 297 L206 297 C200 297 196 294 196 288 Z"
          stroke="#000" stroke-width="6" opacity="0.5"/>
    <path d="M196 280 C196 268 204 264 218 264 L246 264 C258 264 262 270 262 280 L262 290 C262 295 258 297 252 297 L206 297 C200 297 196 294 196 288 Z"
          stroke="#fff" stroke-width="2.5"/>
    <!-- windshield line -->
    <path d="M212 265 L218 277 L250 277" stroke="#000" stroke-width="6" opacity="0.5"/>
    <path d="M212 265 L218 277 L250 277" stroke="#fff" stroke-width="2.5"/>
    <!-- wheels -->
    <path d="M212 297 a7 7 0 0 0 0 1" stroke="#000" stroke-width="10" opacity="0.5"/>
    <path d="M246 297 a7 7 0 0 0 0 1" stroke="#000" stroke-width="10" opacity="0.5"/>
    <path d="M212 297 a7 7 0 0 0 0 1" stroke="#fff" stroke-width="5"/>
    <path d="M246 297 a7 7 0 0 0 0 1" stroke="#fff" stroke-width="5"/>
  </g>
</svg>
