      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/inter-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/inter-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/inter-latin-800-normal.woff2') format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 800; font-display: swap; src: url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); }

    <script>
      (function(){
  // Four themes, matching the site: rainbow (Asgard, default), batman, bond (007), and senna.
  // This is a bundled app whose base CSS :root is light, so we always set an explicit
  // data-theme. Bond and senna must not fall through to rainbow.
  function applyTheme(t){
    document.documentElement.setAttribute(
      'data-theme',
      t === 'batman' ? 'batman' : t === 'bond' ? 'bond' : t === 'senna' ? 'senna' : 'rainbow'
    );
  }
  var urlTheme = new URLSearchParams(location.search).get('theme');
  if (urlTheme) {
    applyTheme(urlTheme);
  } else {
    applyTheme(localStorage.getItem('theme'));
  }
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'parent-theme') {
      applyTheme(e.data.theme);
      // No localStorage write — parent owns persisted preference.
    }
  });
})();
    </script>

    <style>
      #theme-toggle-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted, #888);
        padding: 4px;
        display: flex;
        align-items: center;
        transition: color 0.15s;
      }
      #theme-toggle-btn:hover { color: var(--text-primary, #1a1a1a); }
      #theme-toggle-btn svg { width: 16px; height: 16px; }
      /* Icon shown = the NEXT theme in the cycle (matches site header).
         rainbow (Asgard) → bat, batman → bond, bond → senna, senna → rainbow. */
      .icon-rainbow { display: none; }
      .icon-bat { display: block; }
      .icon-bond { display: none; }
      .icon-senna { display: none; }
      [data-theme="batman"] .icon-bat { display: none; }
      [data-theme="batman"] .icon-bond { display: block; }
      [data-theme="bond"] .icon-bat { display: none; }
      [data-theme="bond"] .icon-senna { display: block; }
      [data-theme="senna"] .icon-bat { display: none; }
      [data-theme="senna"] .icon-rainbow { display: block; }

      [data-theme="rainbow"] {
        --bg-primary: #0b1338 !important;
        --bg-secondary: #070d28 !important;
        --bg-card: #142a66 !important;

        --border: #2e447f !important;

        --text-primary: #fdf4e3 !important;
        --text-secondary: #c9b78a !important;
        --text-muted: #8b95bd !important;
        --accent-red: #ff5e7e !important;
        --accent-blue: #4ad9ff !important;
        --accent-green: #4ade80 !important;
        --accent-gold: #ffcc4d !important;
        --accent-orange: #ff9e5c !important;
        --accent-purple: #c084fc !important;
        --chart-grid: #2e447f !important;
      }

      [data-theme="batman"] {
        --bg-primary: #10151e !important;
        --bg-secondary: #0b0f16 !important;
        --bg-card: #1a212e !important;
        --bg-card-hover: #232c3d !important;
        --border: #283040 !important;
        --border-light: #3a455a !important;
        --text-primary: #c3cbd6 !important;
        --text-secondary: #93a0b3 !important;
        --text-muted: #6e7888 !important;
        --accent-red: #d6736f !important;
        --accent-blue: #5aa9d6 !important;
        --accent-green: #7fb98a !important;
        --accent-gold: #c9a648 !important;
        --accent-orange: #d98a5a !important;
        --accent-purple: #9a86c4 !important;
        --chart-grid: #283040 !important;
      }

      /* Bond (007): tuxedo black, cream/silver text, blood-red as the ONE accent.
         No gold. Secondary data marks are cool desaturated steel so red stays the
         standout, all tuned for high contrast on the near-black background. */
      [data-theme="bond"] {
        --bg-primary: #060607 !important;
        --bg-secondary: #020202 !important;
        --bg-card: #100e0e !important;
        --bg-card-hover: #1a1614 !important;
        --border: #221e1d !important;
        --border-light: #3a3330 !important;
        --text-primary: #f1eee7 !important;
        --text-secondary: #b8b2a8 !important;
        --text-muted: #857f77 !important;
        --accent-red: #e11d3a !important;
        --accent-blue: #7d8a99 !important;
        --accent-green: #8fae9b !important;
        --accent-gold: #c9c2b6 !important;
        --accent-orange: #c08a72 !important;
        --accent-purple: #9aa3ad !important;
        --chart-grid: #221e1d !important;
      }

      /* Senna (Ayrton Senna's helmet): near-black background, off-white text, VIVID
         yellow (#ffd300) as the ONE standout accent, with Brazil-green (#1faf5a) and
         helmet-blue (#1f6fd0) as secondary data marks. Brighter and more saturated
         than batman's muted gold, all tuned for high contrast on near-black. */
      [data-theme="senna"] {
        --bg-primary: #0b0b0c !important;
        --bg-secondary: #050505 !important;
        --bg-card: #15140e !important;
        --bg-card-hover: #1f1c10 !important;
        --border: #2a2614 !important;
        --border-light: #463f1f !important;
        --text-primary: #f4f3ee !important;
        --text-secondary: #d8cfa0 !important;
        --text-muted: #c9b24a !important;
        --accent-red: #ffd300 !important;
        --accent-blue: #1f6fd0 !important;
        --accent-green: #1faf5a !important;
        --accent-gold: #ffd300 !important;
        --accent-orange: #1faf5a !important;
        --accent-purple: #1f6fd0 !important;
        --chart-grid: #2a2614 !important;
      }
    </style>

  <body>
    <div id="root"></div>
    <button id="theme-toggle-btn" aria-label="Toggle theme">
      <svg class="icon-rainbow" viewBox="0 0 24 24" fill="none" stroke-width="2"><defs><linearGradient id="rb-grad-f1" x1="0" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5e7e"/><stop offset="0.33" stop-color="#ffe14d"/><stop offset="0.66" stop-color="#38bdf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs><path d="M2 18a10 10 0 0120 0" stroke="url(#rb-grad-f1)"/><path d="M5 18a7 7 0 0114 0" stroke="url(#rb-grad-f1)" opacity="0.7"/><path d="M8 18a4 4 0 018 0" stroke="url(#rb-grad-f1)" opacity="0.4"/></svg>
      <svg class="icon-bat" viewBox="0 0 24 24" fill="#c9a23f" stroke="none" aria-hidden="true"><path d="M12 9 L12.6 7.6 L13.2 6 L13.7 8.1 L15.2 9.2 L16.8 7.6 L22 8.6 L20 10 L21 11.6 L18.4 11.9 L16.4 13.6 L14.2 13.1 L13.4 15.6 L12 13.8 L10.6 15.6 L9.8 13.1 L7.6 13.6 L5.6 11.9 L3 11.6 L4 10 L2 8.6 L7.2 7.6 L8.8 9.2 L10.3 8.1 L10.8 6 L11.4 7.6 Z"/></svg>
      <svg class="icon-bond" viewBox="0 0 24 24" fill="none" stroke="#e11d3a" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="#e11d3a" stroke="none"/></svg>
      <svg class="icon-senna" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.5C7 3.5 4 7 4 12C4 16 7 20 12 20.5C17 20 20 16 20 12C20 7 17 3.5 12 3.5Z" fill="#ffd300"/><path d="M5.8 8C7.8 6 9.8 5.2 12 5.2C14.2 5.2 16.2 6 18.2 8" stroke="#1faf5a" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="6.4" y="10.6" width="11.2" height="3.2" rx="1.6" fill="#0b0b0c"/></svg>
    </button>
    <script>
      document.getElementById('theme-toggle-btn').addEventListener('click', function() {
        // Cycle: rainbow → batman → bond → senna → rainbow (matches site header).
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'batman' ? 'bond' : cur === 'bond' ? 'senna' : cur === 'senna' ? 'rainbow' : 'batman';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
      // Move toggle into React-rendered header once it mounts
      var observer = new MutationObserver(function() {
        var header = document.querySelector('.header');
        var btn = document.getElementById('theme-toggle-btn');
        if (header && btn) {
          header.appendChild(btn);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
