<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="40" y="44" font-size="15" fill="#111" font-weight="600" letter-spacing="0.5">CRIMES STOPPED PER YEAR</text>
  <text x="40" y="64" font-size="12" fill="#555">One body, three strategies. Same guy. Same city.</text>
  <line x1="40" y1="78" x2="600" y2="78" stroke="#111" stroke-width="1.5"/>

  <!-- baseline -->
  <line x1="80" y1="368" x2="600" y2="368" stroke="#111" stroke-width="1"/>

  <!-- bar 1: patrol at random = 2 -->
  <rect x="110" y="351" width="90" height="17" fill="#bbb"/>
  <text x="155" y="343" font-size="20" fill="#111" font-weight="700" text-anchor="middle">2</text>
  <text x="155" y="390" font-size="12" fill="#111" text-anchor="middle">Patrol at random</text>
  <text x="155" y="406" font-size="11" fill="#555" text-anchor="middle">punch what you bump into</text>

  <!-- bar 2: camp the hot corners = 4 -->
  <rect x="290" y="335" width="90" height="33" fill="#888"/>
  <text x="335" y="327" font-size="20" fill="#111" font-weight="700" text-anchor="middle">4</text>
  <text x="335" y="390" font-size="12" fill="#111" text-anchor="middle">Camp the hot corners</text>
  <text x="335" y="406" font-size="11" fill="#555" text-anchor="middle">sit on the worst blocks</text>

  <!-- bar 3: target the worst offenders = 30 -->
  <rect x="470" y="118" width="90" height="250" fill="#b8332b"/>
  <text x="515" y="110" font-size="20" fill="#b8332b" font-weight="800" text-anchor="middle">30</text>
  <text x="515" y="390" font-size="12" fill="#111" text-anchor="middle" font-weight="600">Target the worst</text>
  <text x="515" y="406" font-size="11" fill="#555" text-anchor="middle">know who, then go</text>

  <text x="40" y="432" font-size="11.5" fill="#555">Being everywhere loses. Knowing who wins by 15x.</text>
</svg>
