<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-label="Two channels, one body" font-family="Inter, system-ui, sans-serif"><rect width="820" height="440" rx="10" fill="#fff"/><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a">Fear vs fists: crimes prevented per year</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555">Log scale. Deterring crime beats physically stopping it, even before any 'fear multiplier'.</text><rect x="300" y="108" width="460" height="200" fill="#fafafa" stroke="#e5e5e5"/><line x1="300.0" y1="108" x2="300.0" y2="308" stroke="#e5e5e5"/><text x="300.0" y="326.0" font-size="11" text-anchor="middle" font-weight="400" fill="#555">1</text><line x1="432.3" y1="108" x2="432.3" y2="308" stroke="#e5e5e5"/><text x="432.3" y="326.0" font-size="11" text-anchor="middle" font-weight="400" fill="#555">10</text><line x1="564.6" y1="108" x2="564.6" y2="308" stroke="#e5e5e5"/><text x="564.6" y="326.0" font-size="11" text-anchor="middle" font-weight="400" fill="#555">100</text><line x1="696.9" y1="108" x2="696.9" y2="308" stroke="#e5e5e5"/><text x="696.9" y="326.0" font-size="11" text-anchor="middle" font-weight="400" fill="#555">1,000</text><text x="530.0" y="346.0" font-size="13" text-anchor="middle" font-weight="400" fill="#555">crimes prevented / year (log)</text><rect x="300.0" y="126.3" width="39.8" height="30" rx="4" fill="#2c3e50" fill-opacity="1"/><text x="347.8" y="146.3" font-size="13" text-anchor="start" font-weight="700" fill="#2c3e50">~2/yr</text><text x="40.0" y="138.3" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Fists (attrition)</text><text x="40.0" y="156.3" font-size="11" text-anchor="start" font-weight="400" fill="#666">one-by-one, geometry+mortality capped</text><rect x="300.0" y="193.0" width="222.4" height="30" rx="4" fill="#c0392b" fill-opacity="1"/><text x="530.4" y="213.0" font-size="13" text-anchor="start" font-weight="700" fill="#c0392b">12-48/yr</text><text x="40.0" y="205.0" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Fear (measured floor)</text><text x="40.0" y="223.0" font-size="11" text-anchor="start" font-weight="400" fill="#666">24% x a 50-200 incident hot spot</text><rect x="300.0" y="259.7" width="460.0" height="30" rx="4" fill="#e67e22" fill-opacity="0.45"/><text x="768.0" y="279.7" font-size="13" text-anchor="start" font-weight="700" fill="#e67e22">100-3000/yr  (soft)</text><text x="40.0" y="271.7" font-size="14" text-anchor="start" font-weight="700" fill="#1a1a1a">Fear x multiplier</text><text x="40.0" y="289.7" font-size="11" text-anchor="start" font-weight="400" fill="#666">London phantom / sniper reach (ANALOGY)</text><line x1="339.8" y1="108" x2="339.8" y2="308" stroke="#2c3e50" stroke-dasharray="4 3"/><text x="40.0" y="366.0" font-size="12" text-anchor="start" font-weight="400" fill="#555">The deterrence floor already clears the fists ceiling by 6-24x, with no analogy required.</text></svg>
