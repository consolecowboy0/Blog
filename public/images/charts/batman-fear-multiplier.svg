<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="40" y="44" font-size="15" fill="#111" font-weight="600" letter-spacing="0.5">WHERE THE FEAR DOES ITS WORK</text>
  <text x="40" y="64" font-size="12" fill="#555">Randomized patrols, London Underground. Drop in crime, by who was watching.</text>
  <line x1="40" y1="78" x2="600" y2="78" stroke="#111" stroke-width="1.5"/>

  <!-- split bar -->
  <rect x="40" y="120" width="16.8" height="64" fill="#888"/>
  <rect x="56.8" y="120" width="543.2" height="64" fill="#b8332b"/>
  <line x1="40" y1="120" x2="600" y2="120" stroke="#111" stroke-width="1"/>
  <line x1="40" y1="184" x2="600" y2="184" stroke="#111" stroke-width="1"/>

  <text x="48" y="210" font-size="12" fill="#111" font-weight="700">3%</text>
  <text x="48" y="226" font-size="11" fill="#555">officer present</text>

  <text x="592" y="210" font-size="12" fill="#b8332b" font-weight="700" text-anchor="end">97%</text>
  <text x="592" y="226" font-size="11" fill="#555" text-anchor="end">nobody there at all</text>

  <line x1="40" y1="262" x2="600" y2="262" stroke="#111" stroke-width="1"/>

  <text x="320" y="320" font-size="64" fill="#b8332b" font-weight="800" text-anchor="middle" letter-spacing="-1">33x</text>
  <text x="320" y="348" font-size="13" fill="#111" text-anchor="middle">the deterrent did more work absent than present</text>
  <text x="320" y="370" font-size="11.5" fill="#555" text-anchor="middle">A body does not scale. A rumor does.</text>
</svg>
