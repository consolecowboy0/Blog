<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 480" width="340" height="480">
  <!-- Minimal line-art: a tall energy-drink can in a cupholder, going warm.
       Theme-proof: black halo under, white line over. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- halo pass (black) -->
    <g stroke="#000" opacity="0.5">
      <path d="M118 140 L118 372" stroke-width="8"/>
      <path d="M222 140 L222 372" stroke-width="8"/>
      <ellipse cx="170" cy="140" rx="52" ry="15" stroke-width="7"/>
      <ellipse cx="170" cy="142" rx="40" ry="11" stroke-width="4"/>
      <ellipse cx="170" cy="140" rx="13" ry="5" stroke-width="4"/>
      <path d="M118 372 Q170 398 222 372" stroke-width="8"/>
      <path d="M118 232 Q170 250 222 232" stroke-width="5"/>
      <path d="M118 300 Q170 318 222 300" stroke-width="5"/>
      <path d="M134 264 L134 286 M150 276 L150 292" stroke-width="4"/>
      <ellipse cx="170" cy="392" rx="86" ry="22" stroke-width="7"/>
    </g>

    <!-- line pass (white) -->
    <g stroke="#fff" opacity="0.95">
      <path d="M118 140 L118 372" stroke-width="2.8"/>
      <path d="M222 140 L222 372" stroke-width="2.8"/>
      <ellipse cx="170" cy="140" rx="52" ry="15" stroke-width="2.4"/>
      <ellipse cx="170" cy="142" rx="40" ry="11" stroke-width="1.6"/>
      <ellipse cx="170" cy="140" rx="13" ry="5" stroke-width="1.6"/>
      <path d="M118 372 Q170 398 222 372" stroke-width="2.8"/>
      <path d="M118 232 Q170 250 222 232" stroke-width="1.8"/>
      <path d="M118 300 Q170 318 222 300" stroke-width="1.8"/>
      <path d="M134 264 L134 286 M150 276 L150 292" stroke-width="1.6"/>
      <ellipse cx="170" cy="392" rx="86" ry="22" stroke-width="2.4"/>
    </g>
  </g>
</svg>
