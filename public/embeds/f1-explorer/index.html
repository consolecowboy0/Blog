    <script>
      (function(){
  // Eight themes, matching the site: rainbow (Asgard, default), batman, vanaheim (007), muspelheim, alfheim, niflheim, midgard, and jotunheim.
  // This is a bundled app whose base CSS :root is light, so we always set an explicit
  // data-theme. Vanaheim, muspelheim, alfheim, niflheim, midgard, and jotunheim must not fall through to rainbow.
  function applyTheme(t){
    document.documentElement.setAttribute(
      'data-theme',
      t === 'batman' ? 'batman' : t === 'vanaheim' ? 'vanaheim' : t === 'muspelheim' ? 'muspelheim' : t === 'alfheim' ? 'alfheim' : t === 'niflheim' ? 'niflheim' : t === 'midgard' ? 'midgard' : t === 'jotunheim' ? 'jotunheim' : 'rainbow'
    );
  }
  var urlTheme = new URLSearchParams(location.search).get('theme');
  if (urlTheme) {
    applyTheme(urlTheme);
  } else {
    applyTheme(localStorage.getItem('theme'));
  }
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'parent-theme') {
      applyTheme(e.data.theme);
      // No localStorage write — parent owns persisted preference.
    }
  });
})();
    </script>
