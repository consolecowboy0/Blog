<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img" aria-label="Three ways to be Batman: crimes prevented per year" font-family="Inter, system-ui, sans-serif"><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a" >Three ways to be Batman</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555" >Crimes prevented per year in Richmond. Log scale: each gridline is another order of magnitude.</text><rect x="250" y="108" width="520" height="250" fill="none" stroke="#e5e5e5"/><line x1="250.0" y1="108" x2="250.0" y2="358" stroke="#e5e5e5"/><text x="250.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >1</text><line x1="318.0" y1="108" x2="318.0" y2="358" stroke="#e5e5e5"/><text x="318.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >2</text><line x1="408.0" y1="108" x2="408.0" y2="358" stroke="#e5e5e5"/><text x="408.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >5</text><line x1="476.0" y1="108" x2="476.0" y2="358" stroke="#e5e5e5"/><text x="476.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >10</text><line x1="544.0" y1="108" x2="544.0" y2="358" stroke="#e5e5e5"/><text x="544.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >20</text><line x1="633.9" y1="108" x2="633.9" y2="358" stroke="#e5e5e5"/><text x="633.9" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >50</text><line x1="702.0" y1="108" x2="702.0" y2="358" stroke="#e5e5e5"/><text x="702.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >100</text><line x1="770.0" y1="108" x2="770.0" y2="358" stroke="#e5e5e5"/><text x="770.0" y="376.0" font-size="12" text-anchor="middle" font-weight="400" fill="#555" >200</text><text x="510.0" y="398.0" font-size="13" text-anchor="middle" font-weight="400" fill="#555" >crimes prevented / year (log scale)</text><line x1="318.7" y1="149.7" x2="569.3" y2="149.7" stroke="#888" stroke-width="2"/><line x1="318.7" y1="142.7" x2="318.7" y2="156.7" stroke="#888" stroke-width="2"/><line x1="569.3" y1="142.7" x2="569.3" y2="156.7" stroke="#888" stroke-width="2"/><circle cx="318.7" cy="149.7" r="7.5" fill="#2c3e50"/><text x="318.7" y="134.7" font-size="13" text-anchor="middle" font-weight="700" fill="#2c3e50" >~2/yr</text><text x="40.0" y="147.7" font-size="15" text-anchor="start" font-weight="700" fill="#1a1a1a" >1. Random patrol</text><text x="40.0" y="166.7" font-size="11" text-anchor="start" font-weight="400" fill="#666" >Wander the city. Geometry-limited.</text><line x1="337.3" y1="233.0" x2="435.9" y2="233.0" stroke="#888" stroke-width="2"/><line x1="337.3" y1="226.0" x2="337.3" y2="240.0" stroke="#888" stroke-width="2"/><line x1="435.9" y1="226.0" x2="435.9" y2="240.0" stroke="#888" stroke-width="2"/><circle cx="393.6" cy="233.0" r="7.5" fill="#e67e22"/><text x="393.6" y="218.0" font-size="13" text-anchor="middle" font-weight="700" fill="#e67e22" >~4/yr</text><text x="40.0" y="231.0" font-size="15" text-anchor="start" font-weight="700" fill="#1a1a1a" >2. Camp the hot spots</text><text x="40.0" y="250.0" font-size="11" text-anchor="start" font-weight="400" fill="#666" >Target the right PLACES (Koper / Weisburd).</text><line x1="447.8" y1="316.3" x2="719.9" y2="316.3" stroke="#888" stroke-width="2"/><line x1="447.8" y1="309.3" x2="447.8" y2="323.3" stroke="#888" stroke-width="2"/><line x1="719.9" y1="309.3" x2="719.9" y2="323.3" stroke="#888" stroke-width="2"/><circle cx="577.0" cy="316.3" r="7.5" fill="#c0392b"/><text x="577.0" y="301.3" font-size="13" text-anchor="middle" font-weight="700" fill="#c0392b" >~28/yr</text><text x="40.0" y="314.3" font-size="15" text-anchor="start" font-weight="700" fill="#1a1a1a" >3. Remove the vital few</text><text x="40.0" y="333.3" font-size="11" text-anchor="start" font-weight="400" fill="#666" >Target the right PEOPLE (Wolfgang's power law).</text><text x="250.0" y="418.0" font-size="11" text-anchor="start" font-weight="400" fill="#555" >Mode 3's band spans an order of magnitude (selection, replacement, desistance).</text><text x="250.0" y="434.0" font-size="11" text-anchor="start" font-weight="400" fill="#555" >And lawful removal = focused deterrence = an institution, not a cape.</text></svg>
