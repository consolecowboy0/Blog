<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="ui-sans-serif, system-ui, sans-serif">
  <text x="40" y="44" font-size="15" fill="#111" font-weight="600" letter-spacing="0.5">THE CLOCK ON THE MAN</text>
  <text x="40" y="64" font-size="12" fill="#555">Odds he is still alive, recharging the fear every couple of weeks.</text>
  <line x1="40" y1="78" x2="600" y2="78" stroke="#111" stroke-width="1.5"/>

  <!-- axes -->
  <line x1="80" y1="110" x2="80" y2="350" stroke="#111" stroke-width="1"/>
  <line x1="80" y1="350" x2="600" y2="350" stroke="#111" stroke-width="1"/>

  <!-- y ticks -->
  <text x="72" y="115" font-size="11" fill="#555" text-anchor="end">100%</text>
  <text x="72" y="234" font-size="11" fill="#555" text-anchor="end">50%</text>
  <text x="72" y="354" font-size="11" fill="#555" text-anchor="end">0%</text>

  <!-- x ticks -->
  <text x="80" y="370" font-size="11" fill="#555" text-anchor="middle">0</text>
  <text x="340" y="370" font-size="11" fill="#555" text-anchor="middle">11 yr</text>
  <text x="600" y="370" font-size="11" fill="#555" text-anchor="middle">22 yr</text>

  <!-- 50% crossing guides -->
  <line x1="80" y1="230" x2="340" y2="230" stroke="#b8332b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="340" y1="230" x2="340" y2="350" stroke="#b8332b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- survival curve -->
  <polyline fill="none" stroke="#111" stroke-width="2.5"
    points="80,110 127.3,138.6 174.5,163.5 221.8,185.6 269.1,205 340,230 410.9,250.6 505.5,272.5 600,290"/>

  <!-- crossing marker -->
  <circle cx="340" cy="230" r="5" fill="#b8332b"/>
  <text x="352" y="222" font-size="13" fill="#b8332b" font-weight="700">coin flip he's dead</text>
  <text x="352" y="240" font-size="11.5" fill="#555">eleven years in</text>

  <text x="40" y="406" font-size="11.5" fill="#555">The legend he built does not age a day. He does.</text>
</svg>
