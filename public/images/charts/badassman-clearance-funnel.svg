<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-label="Of 100 crimes, how many end in an arrest" font-family="Inter, system-ui, sans-serif"><rect width="820" height="440" rx="10" fill="#fff"/><text x="40.0" y="44.0" font-size="22" text-anchor="start" font-weight="700" fill="#1a1a1a">What the system actually catches</text><text x="40.0" y="68.0" font-size="14" text-anchor="start" font-weight="400" fill="#555">Of every 100 crimes committed, how many are reported, and how many end in an arrest.</text><text x="40.0" y="130.0" font-size="15" text-anchor="start" font-weight="700" fill="#c0392b">Violent</text><rect x="300" y="110" width="440.0" height="24" rx="3" fill="#c0392b" fill-opacity="0.95"/><text x="748.0" y="128.0" font-size="13" text-anchor="start" font-weight="400" fill="#c0392b">100 occur</text><rect x="300" y="142" width="206.8" height="24" rx="3" fill="#c0392b" fill-opacity="0.6"/><text x="514.8" y="160.0" font-size="13" text-anchor="start" font-weight="400" fill="#c0392b">47 reported</text><rect x="300" y="174" width="96.8" height="24" rx="3" fill="#c0392b" fill-opacity="0.35"/><text x="404.8" y="192.0" font-size="13" text-anchor="start" font-weight="700" fill="#c0392b">22 arrested</text><text x="40.0" y="250.0" font-size="15" text-anchor="start" font-weight="700" fill="#2c3e50">Property</text><rect x="300" y="230" width="440.0" height="24" rx="3" fill="#2c3e50" fill-opacity="0.95"/><text x="748.0" y="248.0" font-size="13" text-anchor="start" font-weight="400" fill="#2c3e50">100 occur</text><rect x="300" y="262" width="154.0" height="24" rx="3" fill="#2c3e50" fill-opacity="0.6"/><text x="462.0" y="280.0" font-size="13" text-anchor="start" font-weight="400" fill="#2c3e50">35 reported</text><rect x="300" y="294" width="30.8" height="24" rx="3" fill="#2c3e50" fill-opacity="0.35"/><text x="338.8" y="312.0" font-size="13" text-anchor="start" font-weight="700" fill="#2c3e50">7 arrested</text><text x="40.0" y="356.0" font-size="13" text-anchor="start" font-weight="600" fill="#1a1a1a">About 4 in 5 violent crimes, and 19 in 20 property crimes, end in no arrest at all.</text><text x="40.0" y="376.0" font-size="11" text-anchor="start" font-weight="400" fill="#777">Reported share: Pew/BJS ~2015 baseline. Clearance: FBI UCR. Arrest = reported x cleared.</text></svg>
