<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" width="620" height="360" font-family="'JetBrains Mono','Courier New',monospace">
  <!-- transparent + theme-proof: white-fill text with black halo, double-stroke borders -->

  <!-- border (black under, white over = visible on any background) -->
  <rect x="6" y="6" width="608" height="348" rx="14" fill="none" stroke="#000" stroke-width="6" opacity="0.55"/>
  <rect x="6" y="6" width="608" height="348" rx="14" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.8"/>

  <!-- window dots -->
  <circle cx="34" cy="36" r="6.5" fill="#ff5f56" stroke="#000" stroke-width="1"/>
  <circle cx="56" cy="36" r="6.5" fill="#ffbd2e" stroke="#000" stroke-width="1"/>
  <circle cx="78" cy="36" r="6.5" fill="#27c93f" stroke="#000" stroke-width="1"/>

  <g stroke-linejoin="round" paint-order="stroke">
    <text x="310" y="44" text-anchor="middle" fill="#34d171" stroke="#000" stroke-width="4" font-size="20" font-weight="700" letter-spacing="3">TRANSCRIPT — VERBATIM</text>
    <text x="310" y="74" text-anchor="middle" fill="#cfd5e0" stroke="#000" stroke-width="2.5" font-size="13" font-style="italic">WRX cabin · subject: “Chicago” · no edits made</text>

    <text x="40" y="124" fill="#fff" stroke="#000" stroke-width="3" font-size="16">“...riding around with all this big”</text>

    <g font-size="22" font-weight="700">
      <text x="70" y="172" fill="#fff" stroke="#000" stroke-width="4">ding ding</text>
      <text x="70" y="216" fill="#fff" stroke="#000" stroke-width="4">bling bling</text>
      <text x="70" y="260" fill="#34d171" stroke="#000" stroke-width="4">ding ding</text>
    </g>

    <!-- strike lines over the discarded attempts -->
    <g stroke="#ff5f56" stroke-width="3">
      <line x1="66" y1="164" x2="190" y2="164"/>
      <line x1="66" y1="208" x2="208" y2="208"/>
    </g>

    <g font-size="13" font-style="italic" stroke="#000" stroke-width="2">
      <text x="240" y="172" fill="#cfd5e0">attempt 1, withdrawn</text>
      <text x="240" y="216" fill="#cfd5e0">attempt 2, withdrawn</text>
      <text x="240" y="260" fill="#34d171">on the record</text>
    </g>

    <text x="40" y="312" fill="#fff" stroke="#000" stroke-width="3" font-size="15">Final ruling: he meant both.</text>
  </g>
</svg>
