    <script>
      (function(){
  // Five themes, matching the site: rainbow (Asgard, default), batman, vanaheim (007), muspelheim, and alfheim.
  // This is a bundled app whose base CSS :root is light, so we always set an explicit
  // data-theme. Vanaheim, muspelheim, and alfheim must not fall through to rainbow.
  function applyTheme(t){
    document.documentElement.setAttribute(
      'data-theme',
      t === 'batman' ? 'batman' : t === 'vanaheim' ? 'vanaheim' : t === 'muspelheim' ? 'muspelheim' : t === 'alfheim' ? 'alfheim' : 'rainbow'
    );
  }
  var urlTheme = new URLSearchParams(location.search).get('theme');
  if (urlTheme) {
    applyTheme(urlTheme);
  } else {
    applyTheme(localStorage.getItem('theme'));
  }
  window.addEventListener('message', function(e){
    if (e && e.data && e.data.type === 'parent-theme') {
      applyTheme(e.data.theme);
      // No localStorage write — parent owns persisted preference.
    }
  });
})();

    <script>
      document.getElementById('theme-toggle-btn').addEventListener('click', function() {
        // Cycle: rainbow → batman → vanaheim → muspelheim → alfheim → rainbow (matches site header).
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'batman' ? 'vanaheim' : cur === 'vanaheim' ? 'muspelheim' : cur === 'muspelheim' ? 'alfheim' : cur === 'alfheim' ? 'rainbow' : 'batman';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
      // Move toggle into React-rendered header once it mounts
      var observer = new MutationObserver(function() {
        var header = document.querySelector('.header');
        var btn = document.getElementById('theme-toggle-btn');
        if (header && btn) {
          header.appendChild(btn);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
